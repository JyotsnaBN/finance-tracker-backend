name: Send Scheduled Finance Reports

on:
  schedule:
    - cron: "0 7 1,16 * *"   # 07:00 UTC on the 1st and 16th of every month (1 hr after prod)
  workflow_dispatch:

jobs:
  send-reports:
    runs-on: ubuntu-latest

    steps:
      - name: Login and obtain JWT
        id: auth
        env:
          LOGIN_EMAIL: ${{ secrets.REPORT_USER_EMAIL }}
          LOGIN_PASSWORD: ${{ secrets.REPORT_USER_PASSWORD }}
        run: |
          BODY=$(jq -n --arg e "$LOGIN_EMAIL" --arg p "$LOGIN_PASSWORD" \
            '{"email":$e,"password":$p}')
          RESPONSE=$(curl --show-error --silent \
            -X POST "${{ secrets.BACKEND_BASE_URL }}/api/auth/login" \
            -H "Content-Type: application/json" \
            -d "$BODY")
          TOKEN=$(echo "$RESPONSE" | grep -o '"token":"[^"]*"' | cut -d'"' -f4)
          if [ -z "$TOKEN" ]; then
            echo "Login failed. Response: $RESPONSE"
            exit 1
          fi
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Compute date range
        id: dates
        run: |
          DAY=$(date -u +%-d)
          YEAR=$(date -u +%Y)
          MONTH=$(date -u +%m)

          if [ "$DAY" -le 15 ]; then
            # 1st of month: full previous month
            START=$(date -u -d "${YEAR}-${MONTH}-01 -1 month" +%Y-%m-01)
            END=$(date -u -d "${YEAR}-${MONTH}-01 -1 day" +%Y-%m-%d)
          else
            # 16th of month: 1st to 15th of current month
            START="${YEAR}-${MONTH}-01"
            END="${YEAR}-${MONTH}-15"
          fi

          echo "start=$START" >> "$GITHUB_OUTPUT"
          echo "end=$END"     >> "$GITHUB_OUTPUT"

      - name: Send Summary report
        run: |
          RESPONSE=$(curl --show-error --silent -w "\nHTTP_STATUS:%{http_code}" \
            -X GET "${{ secrets.BACKEND_BASE_URL }}/api/reports/summary?startDate=${{ steps.dates.outputs.start }}&endDate=${{ steps.dates.outputs.end }}&sendEmail=true" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.token }}")
          echo "$RESPONSE"
          STATUS=$(echo "$RESPONSE" | grep -o 'HTTP_STATUS:[0-9]*' | cut -d: -f2)
          [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ] || (echo "Failed with status $STATUS" && exit 1)

      - name: Send Income/Expense report
        run: |
          RESPONSE=$(curl --show-error --silent -w "\nHTTP_STATUS:%{http_code}" \
            -X GET "${{ secrets.BACKEND_BASE_URL }}/api/reports/income-expense?startDate=${{ steps.dates.outputs.start }}&endDate=${{ steps.dates.outputs.end }}&sendEmail=true" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.token }}")
          echo "$RESPONSE"
          STATUS=$(echo "$RESPONSE" | grep -o 'HTTP_STATUS:[0-9]*' | cut -d: -f2)
          [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ] || (echo "Failed with status $STATUS" && exit 1)

      - name: Send Category Breakdown report
        run: |
          RESPONSE=$(curl --show-error --silent -w "\nHTTP_STATUS:%{http_code}" \
            -X GET "${{ secrets.BACKEND_BASE_URL }}/api/reports/category-breakdown?startDate=${{ steps.dates.outputs.start }}&endDate=${{ steps.dates.outputs.end }}&sendEmail=true" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.token }}")
          echo "$RESPONSE"
          STATUS=$(echo "$RESPONSE" | grep -o 'HTTP_STATUS:[0-9]*' | cut -d: -f2)
          [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ] || (echo "Failed with status $STATUS" && exit 1)

      - name: Send Account Balances report
        run: |
          RESPONSE=$(curl --show-error --silent -w "\nHTTP_STATUS:%{http_code}" \
            -X GET "${{ secrets.BACKEND_BASE_URL }}/api/reports/account-balances?sendEmail=true" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.token }}")
          echo "$RESPONSE"
          STATUS=$(echo "$RESPONSE" | grep -o 'HTTP_STATUS:[0-9]*' | cut -d: -f2)
          [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ] || (echo "Failed with status $STATUS" && exit 1)
